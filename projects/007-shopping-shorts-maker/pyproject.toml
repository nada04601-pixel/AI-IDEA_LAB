[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shopping-shorts-maker"
version = "0.1.0"
description = "해외 숏폼 링크 → 한국어 쇼핑 쇼츠 자동 제작 CLI"
requires-python = ">=3.11"
# 정확한 버전은 requirements.txt에 고정한다. 여기에는 범위만 둔다.
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "PyYAML>=6",
    "pydantic>=2.6",
]

[project.scripts]
ssm = "ssm.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
