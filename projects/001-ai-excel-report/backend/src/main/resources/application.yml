spring:
  application:
    name: ai-excel-report-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:aiexcel}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 30

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: false

app:
  storage:
    local-path: ${APP_STORAGE_LOCAL_PATH:./uploads}
    max-file-size-bytes: 10485760 # 10MB
    retention-days: 30
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      model: ${ANTHROPIC_MODEL:claude-3-haiku-20240307}
      timeout-seconds: 10
      max-sample-count: 5

logging:
  level:
    root: INFO
    com.aiexcel.report: DEBUG
    org.springframework.security: INFO
    org.flywaydb: INFO
