name: 위탁판매 자동화 웹 데모 배포

# 008 위탁판매 자동화 웹 데모를 gh-pages의 dropship/에 배포한다.
# 공개 주소: https://nada04601-pixel.github.io/AI-IDEA_LAB/dropship/
# 같은 gh-pages의 루트(003 마음기록)와 shorts/(005 떡상 쇼츠)는 그대로 둔다.
on:
  push:
    branches: [main]
    paths:
      - 'projects/008-dropship-automation/**'
      - '.github/workflows/dropship-web.yml'
  workflow_dispatch:

permissions:
  contents: write

# gh-pages에 쓰는 워크플로끼리 겹치지 않게 같은 그룹을 쓴다 (maeum-record-web.yml, shorts-trend.yml과 공유)
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projects/008-dropship-automation/package-lock.json

      - name: 테스트 + 빌드
        working-directory: projects/008-dropship-automation
        run: |
          npm ci
          npm test
          npm run typecheck
          npm run build:web

      - name: gh-pages 가져오기
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site

      - name: dropship/ 교체
        run: |
          rm -rf site/dropship
          mkdir -p site/dropship
          cp -r projects/008-dropship-automation/dist-web/. site/dropship/
          touch site/.nojekyll

      # gh-pages는 배포용이라 기록이 필요 없다. 마지막 커밋을 고쳐 써서 커밋이 쌓이지 않게 한다.
      - name: 배포
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          BEFORE=$(git rev-parse HEAD)
          git commit -q --amend -m "deploy: gh-pages $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST"
          git push -q --force-with-lease=gh-pages:"$BEFORE" origin HEAD:gh-pages
