name: 마음장부 APK 빌드

on:
  push:
    # 개발 브랜치(claude/**)에서도 빌드해서 머지 전에 휴대폰으로 확인할 수 있게 한다
    branches: [main, 'claude/**']
    paths:
      - 'projects/004-maeum-jangbu/**'
      - '.github/workflows/maeum-jangbu-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: maeum-jangbu-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/004-maeum-jangbu
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projects/004-maeum-jangbu/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 웹 빌드 + 안드로이드 동기화
        run: |
          npm ci
          npm test
          CAPACITOR=1 npm run build
          npx cap sync android

      - name: 디버그 APK 빌드
        working-directory: projects/004-maeum-jangbu/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../maeum-jangbu-debug.apk

      - name: 인터넷 권한이 없는지 확인 (tech-stack.md 1-1)
        run: |
          AAPT2="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2"
          "$AAPT2" dump permissions maeum-jangbu-debug.apk | tee permissions.txt
          if grep -E "android.permission.(INTERNET|ACCESS_NETWORK_STATE)" permissions.txt; then
            echo "::error::APK에 인터넷 권한이 들어 있어요. AndroidManifest.xml의 tools:node=\"remove\"를 확인하세요."
            exit 1
          fi

      - name: Actions 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: maeum-jangbu-debug-apk
          path: projects/004-maeum-jangbu/maeum-jangbu-debug.apk

      - name: Releases에 최신 테스트 APK 게시
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=maeum-jangbu-apk
          gh release delete "$TAG" --cleanup-tag -y || true
          gh release create "$TAG" maeum-jangbu-debug.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "마음장부 테스트 APK 0.1.${GITHUB_RUN_NUMBER}" \
            --notes "버전 0.1.${GITHUB_RUN_NUMBER} (앱 설정 화면 맨 아래에서 확인). ${GITHUB_REF_NAME} 브랜치 ${GITHUB_SHA::7} 기준 자동 빌드. 테스트용 디버그 빌드이며 Play 스토어용이 아닙니다. 설치하려면 휴대폰에서 '출처를 알 수 없는 앱 설치'를 허용해야 합니다."
