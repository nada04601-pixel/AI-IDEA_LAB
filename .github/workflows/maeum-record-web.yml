name: 마음기록 웹 배포

# 003 마음기록 PWA를 gh-pages 루트에 배포한다. (deploy.sh와 같은 결과를 Actions에서)
# 공개 주소: https://nada04601-pixel.github.io/AI-IDEA_LAB/
# 같은 gh-pages의 shorts/ (005 떡상 쇼츠)는 그대로 둔다.
on:
  push:
    branches: [main]
    paths:
      - 'projects/003-maeum-record/**'
      - '!projects/003-maeum-record/android/**'
      - '.github/workflows/maeum-record-web.yml'
  workflow_dispatch:

permissions:
  contents: write

# gh-pages에 쓰는 워크플로끼리 겹치지 않게 같은 그룹을 쓴다 (shorts-trend.yml과 공유)
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projects/003-maeum-record/package-lock.json

      - name: 테스트 + 빌드
        working-directory: projects/003-maeum-record
        run: |
          npm ci
          npm test
          npm run build

      - name: gh-pages 가져오기
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site

      - name: 마음기록 파일 교체 (shorts/는 유지)
        run: |
          find site -mindepth 1 -maxdepth 1 ! -name .git ! -name shorts -exec rm -rf {} +
          cp -r projects/003-maeum-record/dist/. site/
          touch site/.nojekyll

      # gh-pages는 배포용이라 기록이 필요 없다. 마지막 커밋을 고쳐 써서 커밋이 쌓이지 않게 한다.
      - name: 배포
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          BEFORE=$(git rev-parse HEAD)
          git commit -q --amend -m "deploy: gh-pages $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST"
          git push -q --force-with-lease=gh-pages:"$BEFORE" origin HEAD:gh-pages
